name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a deploy manually from the Actions tab

concurrency:
  group: deploy-ec2       # never run two deploys at once
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The image is built here, not on the server. The EC2 box is a t2.micro with
  # 951MB of RAM and a 2GB swapfile; compiling this dependency set there would
  # thrash swap and likely OOM. The runner also guarantees linux/amd64, which a
  # local Apple-Silicon build would not.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the image name
        id: meta
        run: |
          # GHCR rejects uppercase in repository names; github.repository is
          # NaveenPrajpati/GenAiBack.
          echo "image=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Tagged by SHA so a deploy is reproducible and rollback is just
          # redeploying an older tag; `latest` tracks main for convenience.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          # Links the package to this repository. Without it GHCR may leave the
          # package unattached, and the deploy job's GITHUB_TOKEN — which has
          # packages:read for THIS repo — gets "not found" on pull, because GHCR
          # reports missing rather than forbidden for packages you can't read.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Without a cache every build recompiles the whole requirements set.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the tag is actually pullable
        # Fail here rather than 20 minutes later on the server. A push that
        # silently produced nothing should break the build job, not the deploy.
        run: |
          docker buildx imagetools inspect \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true   # abort on first failing command
          # GITHUB_TOKEN is scoped to this run and expires when it ends, so no
          # long-lived registry credential ever sits on the server.
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG,IMAGE_NAME
          script: |
            set -euo pipefail
            cd ~/aiserver/genai-back

            # docker-compose.yml lives in the repo, so the server still needs the
            # source — but only for config, never to build.
            git pull origin main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export IMAGE_TAG IMAGE_NAME
            docker compose pull
            docker compose up -d --remove-orphans

            # Wait for the container's own healthcheck rather than a fixed sleep;
            # cold start does RAG warm-up and DB connects (~20s+). Every poll is
            # echoed: a deploy that fails here must say why in the log, not just
            # exit. `|| true` on the inspect keeps `set -e` from killing the loop
            # when the container is mid-restart and inspect briefly fails.
            cid="$(docker compose ps -q api)"
            echo "waiting for health of ${cid:0:12}..."
            status=unknown
            # 120 * 5s = 10 minutes. Measured: a cold start on this t2.micro
            # blew past 5 minutes (burstable CPU, cold page cache, ~320MB of
            # block reads), while the same image warms in ~18s on a laptop.
            for i in $(seq 1 120); do
              status="$(docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                "$cid" 2>/dev/null)" || status=inspect-failed
              echo "  [$i] $status"
              # Every statement here must exit 0 on the "keep waiting" path.
              # `[ x = y ] && break` returns 1 when the test is false, and
              # drone-ssh's script_stop treats that as a failed command and
              # aborts the deploy — so branch only with if/fi, never with &&.
              if [ "$status" = healthy ] || [ "$status" = no-healthcheck ]; then
                break
              fi
              if [ "$status" = unhealthy ]; then
                echo "--- last healthcheck output ---"
                docker inspect --format '{{range .State.Health.Log}}{{.ExitCode}}: {{.Output}}{{end}}' "$cid" || true
                echo "--- container logs ---"
                docker compose logs --tail=80 api || true
                exit 1
              fi
              sleep 5
            done

            if [ "$status" != healthy ] && [ "$status" != no-healthcheck ]; then
              echo "never became healthy (last status: $status)"
              docker inspect --format '{{range .State.Health.Log}}{{.ExitCode}}: {{.Output}}{{end}}' "$cid" || true
              docker compose logs --tail=80 api || true
              exit 1
            fi

            # Confirm through the published port, i.e. what Caddy actually proxies to.
            curl -fsS --max-time 10 http://127.0.0.1:8000/ >/dev/null

            docker logout ghcr.io
            # Old image layers accumulate on a 19GB disk; keep only what's in use.
            docker image prune -af --filter "until=168h"
            echo "deployed ${IMAGE_TAG}"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          IMAGE_NAME: ${{ needs.build.outputs.image }}
