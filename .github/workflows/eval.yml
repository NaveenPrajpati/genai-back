name: RAG eval (smoke gate)

# Runs the offline RAG answer-quality eval on every PR.
#
# POSTURE: a LOOSE "smoke gate" — it BLOCKS the merge only on a catastrophic
# regression (broken prompt, inverted grounding gate, ungrounded generator). The
# bars (SMOKE_THRESHOLDS in eval_harness.py) sit far below the run-to-run wobble of
# a small, LLM-judged eval, so a normal PR is never false-blocked.
#
# TO PROMOTE TO A STRICT QUALITY GATE (do this once the golden set is ~40+ rows and
# a few runs have confirmed the variance): change `--gate-mode smoke` to
# `--gate-mode strict` in the eval step below. Strict uses the tight THRESHOLDS,
# which should be re-tuned to sit just under the observed minimum score.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  rag-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      # Deterministic, no keys required — guards the harness/scoring logic itself.
      # Blocks: if it fails, the eval code is broken.
      - name: Harness self-test (offline)
        run: .venv/bin/python -m app.services.rag.eval_harness --self-test

      # Real eval against the golden set. SMOKE GATE: `--gate --gate-mode smoke`
      # exits non-zero (failing the PR) only on a catastrophic regression. Bash
      # runs with pipefail by default, so the python exit code propagates through
      # `tee`. Frozen-context mode needs no Pinecone/Redis — only OpenAI for
      # generation + the faithfulness judge. Supabase vars are placeholders so
      # config imports.
      - name: RAG answer eval (smoke gate)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_KEY: "placeholder-unused-in-frozen-context-eval"
        run: |
          .venv/bin/python -m app.services.rag.eval_harness \
            --data app/services/rag/datasets/rag_golden.jsonl \
            --gate --gate-mode smoke | tee eval-report.json

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: eval-report.json
          if-no-files-found: ignore
